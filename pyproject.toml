[project]
name = "gemma-tools"
version = "0.1.0"
description = "Fine-tuning, evaluation, and deployment tools for Gemma 3 270M-IT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-ruff>=0.3",
    "pytest-mypy>=0.10",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "types-PyYAML>=6.0",
]
# FunctionGemma host-side stack — Phase A smoke + §15 GGUF pre-flight.
# Heavy (~1.5 GiB with torch). Opt-in via `uv sync --extra functiongemma`.
# See docs/plans/FunctionGemma/README.md §7.2 / §15.
functiongemma = [
    "transformers>=4.45",
    "accelerate>=1.0",
    "torch>=2.4",
    "huggingface-hub>=0.25",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "sentencepiece>=0.2",
    "gguf>=0.10",
    # Programmatic GGUF inference for §15.4 G_FG_GGUF_PREFLIGHT and the
    # M2 Phase A smoke. llama-cli at upstream pin d775992 does not
    # propagate tools= to the jinja chat template (tools/cli/cli.cpp:210
    # `inputs.tools = {}; // TODO`), so a Python harness is the only
    # in-repo path that exercises the FunctionGemma wire format.
    "llama-cpp-python>=0.3",
]

[project.scripts]
bench-prompt = "gemma_tools.bench_prompt:main"
bench-eval = "gemma_tools.bench_eval:main"
bench-remote = "gemma_tools.bench_remote:main"
chat-probe = "gemma_tools.chat_probe:main"
sft-build = "gemma_tools.sft_build:main"
logits-equiv = "gemma_tools.logits_equivalence:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_optional = true
cache_dir = ".cache/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
