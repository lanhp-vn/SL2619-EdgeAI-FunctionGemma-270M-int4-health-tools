# Dispenser-demo prototype patient — synthetic, NOT a real record.
# Shape mirrors data/health_table_v1.yaml (loader: src/gemma_tools/health_table.py)
# so the non-dispense tools (vitals/allergies/appt/contact/food) still resolve.
#
# Paired with scripts/functiongemma/deploy/chat_board_dispense.py, which
# hijacks get_medications_at_time and get_medication_by_name to route to the
# plan.md §6 dispense intent (mock BLE notify + canned response).
# The medications list below is still consumed by check_food_interaction
# (avoid_foods) and is included for shape-parity with v1 — it is NOT what
# the model surfaces on dispense intents.

